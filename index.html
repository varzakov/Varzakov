<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090914">
<title>Informasi Hadiah</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top, #30215e, transparent 60%),
    #090914;
}

.container {
  width: 100%;
  max-width: 390px;
  padding: 30px 24px;
  text-align: center;
  background: #17172b;
  border: 1px solid #5144a0;
  border-radius: 22px;
  box-shadow: 0 0 35px #693cff55;
}

.icon {
  font-size: 42px;
  margin-bottom: 12px;
}

.official-label {
  display: inline-block;
  padding: 7px 13px;
  margin-bottom: 15px;
  border: 1px solid #6652b5;
  border-radius: 20px;
  background: #29213e;
  color: #d9c7ff;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}

h1 {
  font-size: 27px;
  line-height: 1.3;
  margin: 8px 0 12px;
}

.description {
  color: #c4c4d8;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 22px;
}

.photo-box {
  width: 100%;
  max-width: 240px;
  aspect-ratio: 1 / 1;
  margin: 0 auto 24px;
  overflow: hidden;
  border: 2px solid #8b5cff;
  border-radius: 15px;
  background: #24243b;
  box-shadow: 0 0 22px #813cff44;
}

.photo-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.status-box {
  margin: 0 0 22px;
  padding: 14px;
  text-align: left;
  background: #22223a;
  border: 1px solid #39395a;
  border-radius: 12px;
}

.status-title {
  color: #aaaac5;
  font-size: 11px;
  margin-bottom: 7px;
}

.status-value {
  color: #a9f5c5;
  font-size: 14px;
  font-weight: bold;
}

.claim-number {
  margin-top: 8px;
  color: #aaaac5;
  font-size: 11px;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  background: linear-gradient(120deg, #813cff, #e33cff);
  box-shadow: 0 0 20px #a13cff66;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.footer {
  margin-top: 20px;
  color: #77778f;
  font-size: 11px;
}
</style>
</head>

<body>

<main class="container">

  <div class="icon">🎉</div>

  <div class="official-label">
    INFORMASI HADIAH
  </div>

  <h1>Selamat! Anda Mendapatkan Hadiah!</h1>

  <p class="description">
    Kami punya sesuatu yang spesial untuk Anda.
    Tekan tombol di bawah untuk melihat informasi
    lebih lanjut mengenai hadiah Anda.
  </p>

  <div class="photo-box">
    <img src="boba17.jpg" alt="Foto hadiah">
  </div>

  <div class="status-box">
    <div class="status-title">STATUS HADIAH</div>

    <div class="status-value">
      ✓ Berhasil diperoleh
    </div>

    <div class="claim-number">
      Nomor: PRIZE-2026-0817
    </div>
  </div>

  <button onclick="window.location.href='deskripsi.html'">
    LANJUTKAN →
  </button>

  <div class="footer">
    Halaman simulasi hadiah
  </div>

</main>

</body>
</html>
