<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090914">
<title>Hadiah Spesial 🎁</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #29205c, #090914 65%);
}

.card {
  width: 90%;
  max-width: 380px;
  padding: 35px 24px;
  text-align: center;
  background: #17172b;
  border: 1px solid #5144a0;
  border-radius: 22px;
  box-shadow: 0 0 35px #693cff55;
}

.gift {
  font-size: 75px;
  margin-bottom: 15px;
}

h1 {
  font-size: 27px;
  margin: 10px 0;
}

p {
  color: #c4c4d8;
  line-height: 1.6;
}

button {
  margin-top: 20px;
  padding: 16px 25px;
  width: 100%;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  background: linear-gradient(120deg, #813cff, #e33cff);
  box-shadow: 0 0 20px #a13cff77;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

/* Layar glitch */
#glitch {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #050509;
  overflow: hidden;
}

#glitch.active {
  display: block;
}

.noise {
  position: absolute;
  inset: 0;
  opacity: .2;
  pointer-events: none;
  background: repeating-linear-gradient(
    transparent 0px,
    transparent 3px,
    #ffffff 4px,
    transparent 5px
  );
  animation: scan .15s infinite;
  z-index: 5;
}

@keyframes scan {
  from { transform: translateY(-5px); }
  to { transform: translateY(5px); }
}

/* Tulisan utama */
.glitch-text {
  position: absolute;
  top: 43%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  text-align: center;
  font-size: clamp(32px, 9vw, 60px);
  font-weight: 900;
  color: white;
  text-shadow: 3px 0 #ff1744, -3px 0 #00e5ff;
  animation: shake .12s infinite;
  z-index: 3;
  pointer-events: none;
}

.glitch-text small {
  display: block;
  font-size: 16px;
  margin-top: 15px;
  color: #aaa;
}

@keyframes shake {
  0% { transform: translate(-51%, -50%); }
  50% { transform: translate(-49%, -50%); }
  100% { transform: translate(-51%, -50%); }
}

/* Foto yang terus bertambah */
.glitch-image {
  position: absolute;
  width: clamp(65px, 19vw, 105px);
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border: 2px solid white;
  border-radius: 5px;
  box-shadow: 0 0 15px #ff1744aa;
  animation: imageGlitch .18s infinite alternate;
  z-index: 2;
  pointer-events: none;
}

@keyframes imageGlitch {
  0% {
    transform: translate(2px, -2px) rotate(-4deg);
    filter: contrast(1.5) hue-rotate(35deg);
  }
  50% {
    transform: translate(-3px, 2px) rotate(3deg);
    filter: contrast(1.8) hue-rotate(-35deg);
  }
  100% {
    transform: translate(2px, 1px) rotate(-2deg);
    filter: contrast(1.4) saturate(1.8);
  }
}

/* Countdown */
#timer {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
  font-size: 16px;
  color: #aaa;
  z-index: 6;
}
</style>
</head>

<body>

<main class="card">
  <div class="gift">🎁</div>
  <h1>Hadiah Spesial!</h1>
  <p>
    Selamat! Kamu terpilih mendapatkan hadiah misterius.
    Tekan tombol di bawah untuk membukanya.
  </p>
  <button id="start">AMBIL HADIAH SEKARANG ✨</button>
</main>

<div id="glitch" aria-live="polite">
  <div class="noise"></div>

  <div class="glitch-text">
    SYSTEM GLITCH
    <small>WHAT JUST HAPPENED?!</small>
  </div>

  <div id="timer">Efek berlangsung selama 5 detik</div>
</div>

<audio id="music" src="music.mp3" preload="auto">

<script>
const start = document.getElementById("start");
const glitch = document.getElementById("glitch");
const music = document.getElementById("music");
const timer = document.getElementById("timer");

const imageFile = "glitch.jpg";

let running = false;
let finishTimeout = null;
let countdownInterval = null;
let imageInterval = null;
let lockVolumeInterval = null;

const FIXED_VOLUME = 1.0;

// ✅ Otomatis main ulang kalau audio selesai
music.addEventListener('ended', function() {
  music.currentTime = 0;
  music.play();
});

function showRandomImage() {
  for(let i = 0; i < 30; i++) {
    const img = document.createElement("img");
    img.src = imageFile;
    img.className = "glitch-image";
    img.alt = "Efek glitch";
    img.style.left = (Math.random() * 85) + "%";
    img.style.top = (Math.random() * 85) + "%";
    glitch.appendChild(img);
  }
}

function clearGlitchImages() {
  glitch.querySelectorAll(".glitch-image").forEach(img => img.remove());
}

function finishEffect() {
  clearTimeout(finishTimeout);
  clearInterval(countdownInterval);
  clearInterval(imageInterval);
  clearInterval(lockVolumeInterval);

  glitch.classList.remove("active");
  clearGlitchImages();

  music.pause();
  music.currentTime = 0;

  timer.textContent = "Efek berlangsung selama 5 detik";
  running = false;
}

async function startEffect() {
  if (running) return;
  running = true;

  music.currentTime = 0;
  music.volume = FIXED_VOLUME;

  lockVolumeInterval = setInterval(() => {
    if (music.volume !== FIXED_VOLUME) {
      music.volume = FIXED_VOLUME;
    }
  }, 100);

  try {
    await music.play();
  } catch (error) {
    console.log("Audio tidak dapat diputar:", error);
  }

  glitch.classList.add("active");

  let remaining = 5;
  timer.textContent = `Efek berakhir dalam ${remaining} detik`;

  showRandomImage();
  imageInterval = setInterval(showRandomImage, 1);

  countdownInterval = setInterval(() => {
    remaining--;
    if (remaining > 0) {
      timer.textContent = `Efek berakhir dalam ${remaining} detik`;
    }
  }, 1000);

  finishTimeout = setTimeout(finishEffect, 60000);
}

start.addEventListener("click", startEffect);
</script>

</body>
</html>
